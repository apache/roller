github:
  pull_requests:
    # merge a pull request once it has its review and its checks pass
    allow_auto_merge: true
    # delete a pull request's branch once it's merged
    del_branch_on_merge: true
  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      # every review conversation has to be resolved before a merge
      required_conversation_resolution: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        # an approval stays when the author pushes more commits, such as a
        # merge to resolve a CHANGES.md conflict
        require_last_push_approval: false
      # checks reported by GitHub Actions workflows (CodeQL included)
      required_status_checks:
        - name: "Build+Test on Linux/JDK 21"
          app_slug: "github-actions"
        - name: "Build+Test on Linux/JDK 25"
          app_slug: "github-actions"
        - name: "License headers"
          app_slug: "github-actions"
        - name: "UI tests (db)"
          app_slug: "github-actions"
        - name: "UI tests (db-oidc)"
          app_slug: "github-actions"
        - name: "UI tests (oidc)"
          app_slug: "github-actions"
        - name: "Analyze (java)"
          app_slug: "github-actions"
        - name: "Analyze (javascript)"
          app_slug: "github-actions"
    # no workflow runs on pull requests to release branches, so requiring
    # checks there would block every merge
    - name: "Release Branch Protection"
      type: branch
      branches:
        includes:
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      # every review conversation has to be resolved before a merge
      required_conversation_resolution: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        # an approval stays when the author pushes more commits, such as a
        # merge to resolve a CHANGES.md conflict
        require_last_push_approval: false
    - name: "6.1.x Branch Protection"
      type: branch
      branches:
        includes:
          - "roller-6.1.x"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
      # every review conversation has to be resolved before a merge
      required_conversation_resolution: true
      required_pull_request_reviews:
        required_approving_review_count: 1
        # an approval stays when the author pushes more commits, such as a
        # merge to resolve a CHANGES.md conflict
        require_last_push_approval: false
      # checks reported by GitHub Actions workflows (CodeQL included)
      required_status_checks:
        - name: "Build+Test on Linux/JDK 11"
          app_slug: "github-actions"
        - name: "Build+Test on Linux/JDK 17"
          app_slug: "github-actions"
        - name: "Build+Test on Linux/JDK 21"
          app_slug: "github-actions"
        - name: "Build+Test on Linux/JDK 25"
          app_slug: "github-actions"
        - name: "Analyze (java)"
          app_slug: "github-actions"
        - name: "Analyze (javascript)"
          app_slug: "github-actions"
