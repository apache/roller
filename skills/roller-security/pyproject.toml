[project]
name = "roller-security-graph"
version = "0.1.0"
description = "Obsidian-free LangGraph security triage workflow for Apache Roller"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.24",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-core==1.8.5",
    "pydantic==2.14.4",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
google = ["langchain-google-genai==4.5.3"]
anthropic = ["langchain-anthropic==1.7.13"]
openai = ["langchain-openai==1.8.5"]
ollama = ["langchain-ollama==1.2.0"]
all-llms = [
    "langchain-google-genai==4.5.3",
    "langchain-anthropic==1.7.13",
    "langchain-openai==1.8.5",
    "langchain-ollama==1.2.0",
]
dev = ["pytest==9.2.0"]

[project.scripts]
roller-security = "roller_security.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roller_security"]

[tool.pytest.ini_options]
testpaths = ["tests"]
