# specify resource loaders to use
# Weblog templates are authored by untrusted weblog administrators, so the
# loader set is limited to the webapp templates, the active theme, and the
# weblog's own stored templates. The classpath is deliberately not a
# resolvable namespace for them.
resource.loaders = webapp, theme, roller

# theme resource loader
resource.loader.theme.public.name=theme
resource.loader.theme.description=Roller Theme Resource Loader
resource.loader.theme.class=org.apache.roller.weblogger.ui.rendering.velocity.ThemeResourceLoader
resource.loader.theme.cache=false
resource.loader.theme.modification_check_interval=2

# for the loader we call 'roller', use the RollerResourceLoader
resource.loader.roller.public.name=roller
resource.loader.roller.description=Roller Main Resource Loader
resource.loader.roller.class=org.apache.roller.weblogger.ui.rendering.velocity.RollerResourceLoader
resource.loader.roller.cache=false
resource.loader.roller.modification_check_interval=2

# for the loader we call 'webapp', use the WebappResourceLoader
resource.loader.webapp.description = Roller Webapp Resource Loader
resource.loader.webapp.class = org.apache.roller.weblogger.ui.rendering.velocity.WebappResourceLoader
resource.loader.webapp.cache=true
resource.loader.webapp.modification_check_interval=60

# log invalid template references?
# set this to false to have a quieter velocity.log
runtime.log.invalid.reference=false

# tell Velocity to use Log4J
runtime.log.logsystem.class=org.apache.velocity.runtime.log.SimpleLog4JLogSystem
runtime.log.logsystem.log4j.category=org.apache.velocity

# modern JVMs have fast deduplication
runtime.string_interning=false

# Override the default global library, set to blank to load no default
velocimacro.library.path = weblog.vm,feeds.vm,roller-custom.vm

# Change to false for deployment environments.
# Caching for the 'class' & 'webapp' ResourceLoaders must be false for this to work
velocimacro.library.autoreload=true

# Allow Velocimacros to be defined in regular templates
velocimacro.inline.allow=true

# Macros a template defines belong to that template, and to the render it
# starts, so one weblog's macro never replaces another's of the same name and
# an edited macro takes effect on the next render. With replace_global, the
# page's macros are also seen by the templates it #parses, and a macro
# defined in a #parse'd template is seen by the rest of the page, as before.
# Library macros (velocimacro.library.path) stay global.
velocimacro.inline.local_scope=true
velocimacro.inline.replace_global=true

# set encoding/charset to UTF-8
resource.default_encoding=UTF-8
default.contentType=text/html; charset=utf-8

# Keep these settings aligned with /WEB-INF/velocity.properties.
#
# Weblog templates are written by weblog authors, so a render is bounded by
# rendering.maxOutputChars and rendering.maxRenderSeconds in
# roller.properties. Each setting below does part of that:
# - parser.class: RenderLimitParser swaps in nodes that stop string literals,
#   + and blocks used as strings at the output limit as they are built.
# - introspector.uberspect.class: RenderLimitUberspector, chained after
#   SecureUberspector, checks the deadline on every method call and property
#   read, stops a call that returns or could build a string longer than the
#   output limit, and runs regular expressions given to String methods under
#   the deadline. It does not offer the methods whose result can't be bounded
#   from the call: repeat, format, formatted, join and indent on String, any
#   other String method returning a string that StringGrowth doesn't know,
#   and repeat on StringBuilder and StringBuffer.
# - runtime.custom_directives: RollerForeach checks the deadline on every
#   #foreach pass.
# - directive.foreach.max_loops: a #foreach stops after this many passes.
# - event_handler.reference_insertion.class: RenderLimitInsertionHandler
#   checks the deadline, and each inserted value against the output limit.
parser.class=org.apache.roller.weblogger.ui.rendering.velocity.RenderLimitParser
introspector.uberspect.class=org.apache.velocity.util.introspection.SecureUberspector,org.apache.roller.weblogger.ui.rendering.velocity.RenderLimitUberspector
runtime.custom_directives=org.apache.roller.weblogger.ui.rendering.velocity.RollerForeach
event_handler.reference_insertion.class=org.apache.roller.weblogger.ui.rendering.velocity.RenderLimitInsertionHandler

# SecureUberspector governs method access, not resource resolution, so the
# include directives are confined separately.
event_handler.include.class=org.apache.roller.weblogger.ui.rendering.velocity.ThemeIncludeEventHandler
