# Version updates for master. Each ecosystem gets at most one grouped pull
# request a week, since every pull request event mails commits@. A release
# has to be 3 days (72 hours) old before it's proposed; security updates
# don't wait.
version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/it-playwright"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    # The build image's tag carries the JDK, and Dependabot proposes a newer
    # JDK with each Maven update. The build stays on Roller's minimum JDK, so
    # update the maven image by hand; tomcat updates are still proposed.
    ignore:
      - dependency-name: "maven"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      docker-compose:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
